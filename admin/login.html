<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>تسجيل دخول الإدارة | نوها</title>
    <link rel="stylesheet" href="/admin/admin.css">
    <script type="module" src="/admin/login.js" defer></script>
  </head>
  <body class="admin-auth-page">
    <main class="auth-shell" aria-labelledby="login-title">
      <section class="auth-panel">
        <p class="brand">نوها</p>
        <h1 id="login-title">تسجيل دخول الإدارة</h1>

        <form id="login-form" class="auth-form" novalidate>
          <label for="email">البريد الإلكتروني</label>
          <input id="email" name="email" type="email" autocomplete="username" required>

          <label for="password">كلمة المرور</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>

          <p id="login-message" class="form-message" role="status" aria-live="polite"></p>

          <button id="login-submit" type="submit">دخول</button>
        </form>
      </section>
    </main>
  </body>
</html>
