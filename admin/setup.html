<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>إعداد الإدارة | نوها</title>
    <link rel="stylesheet" href="/admin/admin.css">
    <script type="module" src="/admin/setup.js" defer></script>
  </head>
  <body class="admin-auth-page">
    <main class="auth-shell" aria-labelledby="setup-title">
      <section class="auth-panel">
        <p class="brand">نوها</p>
        <h1 id="setup-title">إعداد المدير الأول</h1>

        <form id="setup-form" class="auth-form" novalidate>
          <label for="email">البريد الإداري</label>
          <input id="email" name="email" type="email" value="Nawafoly6@gmail.com" autocomplete="username" readonly>

          <label for="setup-token">رمز الإعداد</label>
          <input id="setup-token" name="setupToken" type="password" autocomplete="off" required>

          <label for="password">كلمة المرور</label>
          <input id="password" name="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>

          <label for="confirm-password">تأكيد كلمة المرور</label>
          <input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>

          <p id="setup-message" class="form-message" role="status" aria-live="polite"></p>

          <button id="setup-submit" type="submit">إنشاء المدير</button>
        </form>
      </section>
    </main>
  </body>
</html>
